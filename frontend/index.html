<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Campus Rescue — Autonomous Schedule Repair & Room Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-low": "#181b25",
            "surface": "#0f131c",
            "surface-container": "#1c1f29",
            "surface-container-high": "#262a34",
            "surface-container-highest": "#31353f",
            "primary": "#4cd7f6",
            "primary-container": "#06b6d4",
            "secondary": "#4edea3",
            "tertiary": "#c0c1ff",
            "error": "#ffb4ab",
            "error-container": "#93000a",
            "on-surface": "#dfe2ef",
            "outline": "#869397"
          },
          fontFamily: {
            "headline": ["Space Grotesk", "sans-serif"],
            "body": ["Geist", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #090D16;
      color: #DFE2EF;
      font-family: 'Geist', sans-serif;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
    }
    .glass-card-elevated {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(6, 182, 212, 0.3);
      box-shadow: 0 0 24px -4px rgba(6, 182, 212, 0.25);
    }
  </style>
</head>
<body class="bg-[#090D16] min-h-screen text-[#DFE2EF] antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
