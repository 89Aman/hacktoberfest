<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Campus Rescue — Autonomous Schedule Repair & Room Allocation</title>
  <meta name="description" content="Production-ready neuro-symbolic campus schedule repair and classroom allocation platform combining Google Gemma 4 and Z3 SMT prover."/>
  <meta name="theme-color" content="#090D16"/>
  <link rel="canonical" href="https://campusrescue.hacktoberfest.edu/"/>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://campusrescue.hacktoberfest.edu/"/>
  <meta property="og:title" content="Campus Rescue — Autonomous Schedule Repair & Room Allocation"/>
  <meta property="og:description" content="Neuro-symbolic campus schedule repair combining Google Gemma 4 intent understanding with formal Z3 SMT collision verification."/>
  <meta property="og:site_name" content="Campus Rescue"/>

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Campus Rescue — Autonomous Schedule Repair & Room Allocation"/>
  <meta name="twitter:description" content="Autonomous campus room allocation and emergency timetable repair engine powered by Google Gemma 4 and Z3 SMT prover."/>

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Campus Rescue",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "All",
    "description": "Autonomous neuro-symbolic campus schedule repair and room allocation system.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#090D16",
            "surface-panel": "#0F172A",
            "surface-card": "#131B2E",
            "primary": "#06B6D4",
            "emerald-accent": "#10B981",
            "amber-accent": "#F59E0B",
            "crimson-accent": "#EF4444",
            "purple-accent": "#8B5CF6"
          },
          fontFamily: {
            "headline": ["Space Grotesk", "sans-serif"],
            "body": ["Geist", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background-color: #090D16;
      color: #DFE2EF;
      font-family: 'Geist', sans-serif;
      margin: 0;
      overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
    }
    .glass-card-elevated {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(6, 182, 212, 0.3);
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.2);
    }
    /* Custom scrollbar for matrix table */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #090D16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    /* Focus rings */
    *:focus-visible {
      outline: 2px solid #06B6D4;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="bg-[#090D16] min-h-screen text-[#DFE2EF] antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
